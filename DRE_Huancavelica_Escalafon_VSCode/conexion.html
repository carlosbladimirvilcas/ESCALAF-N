<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conexión a vgallardo</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f2f6fc;color:#10233f;font-family:Inter,Arial,sans-serif}.card{width:min(560px,100%);background:#fff;border:1px solid #d7e3f4;border-radius:16px;padding:28px;box-shadow:0 16px 40px rgba(15,42,74,.12)}h1{margin:0 0 8px;font-size:25px}.description{margin:0 0 24px;color:#52647d}.status{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:12px;background:#edf3fb}.status.ok{background:#e8f8f1;color:#075d42}.status.error{background:#fff0f0;color:#8b1724}.icon{font-size:24px;line-height:1}.status strong,.status span{display:block}.status span{margin-top:5px;font-size:14px;line-height:1.45}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.detail{padding:12px;border:1px solid #d7e3f4;border-radius:10px}.detail small,.detail b{display:block}.detail small{color:#65758b;margin-bottom:5px}button{width:100%;margin-top:20px;border:0;border-radius:10px;padding:12px;background:#0f2a4a;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}@media(max-width:480px){.details{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="card">
    <h1>Conexión con la base de datos</h1>
    <p class="description">Comprobación segura de MySQL para la base <strong>vgallardo</strong>.</p>
    <section class="status" id="estado" aria-live="polite">
      <div class="icon" id="icono">⏳</div>
      <div><strong id="titulo">Comprobando conexión…</strong><span id="mensaje">Espere un momento.</span></div>
    </section>
    <section class="details" id="detalles" hidden>
      <div class="detail"><small>Base de datos</small><b id="base-datos">—</b></div>
      <div class="detail"><small>Tablas detectadas</small><b id="tablas">—</b></div>
    </section>
    <button id="probar" type="button">Volver a probar</button>
  </main>
  <script>
    const estado = document.getElementById('estado');
    const boton = document.getElementById('probar');
    async function probarConexion() {
      boton.disabled = true;
      estado.className = 'status';
      document.getElementById('icono').textContent = '⏳';
      document.getElementById('titulo').textContent = 'Comprobando conexión…';
      document.getElementById('mensaje').textContent = 'Espere un momento.';
      document.getElementById('detalles').hidden = true;
      try {
        const respuesta = await fetch('api/estado-db.php', {cache: 'no-store'});
        const datos = await respuesta.json();
        if (!respuesta.ok || !datos.ok) throw new Error(datos.detalle || datos.mensaje);
        estado.className = 'status ok';
        document.getElementById('icono').textContent = '✓';
        document.getElementById('titulo').textContent = 'Conexión correcta';
        document.getElementById('mensaje').textContent = datos.mensaje;
        document.getElementById('base-datos').textContent = datos.baseDatos;
        document.getElementById('tablas').textContent = datos.tablas;
        document.getElementById('detalles').hidden = false;
      } catch (error) {
        estado.className = 'status error';
        document.getElementById('icono').textContent = '×';
        document.getElementById('titulo').textContent = 'No se pudo conectar';
        document.getElementById('mensaje').textContent = error.message || 'Revise la configuración del servidor.';
      } finally {
        boton.disabled = false;
      }
    }
    boton.addEventListener('click', probarConexion);
    probarConexion();
  </script>
</body>
</html>
